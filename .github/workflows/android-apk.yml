# 📱 Kunwar Shree PMS — Android APK
# GitHub par code aate hi ye APK banata hai aur "Releases" me rakh deta hai.
# Haath se chalana ho: Actions → "Android APK" → Run workflow.
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # har build ka naya number — phone purane ke upar update install kar le
      - name: Version
        run: |
          node -e "
            const fs=require('fs');const j=JSON.parse(fs.readFileSync('app.json','utf8'));
            j.expo.android.versionCode=${{ github.run_number }};
            j.expo.version='1.0.${{ github.run_number }}';
            fs.writeFileSync('app.json',JSON.stringify(j,null,2));"
          echo "APP_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Prebuild (android folder)
        run: npx expo prebuild -p android --no-install

      # hamesha ek hi signature — warna update install nahi hota
      - name: Signing key
        run: cp signing/debug.keystore android/app/debug.keystore

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "KunwarShree-PMS-${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: KunwarShree-PMS-${{ env.APP_VERSION }}
          path: KunwarShree-PMS-*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Kunwar Shree PMS ${{ env.APP_VERSION }}
          body: Phone me install karne ke liye neeche wali .apk file download karein.
          files: KunwarShree-PMS-*.apk
